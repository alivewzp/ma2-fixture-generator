<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MA2 灯库生成器 V1</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f1117;
    color: #ffffff;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

.header {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 28px;
    background: #171a22;
    border-bottom: 1px solid #292e3a;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #4da3ff;
}

.container {
    max-width: 1500px;
    margin: 30px auto;
    padding: 0 24px;
}

.title {
    margin-bottom: 24px;
}

.title h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.title p {
    margin: 0;
    color: #8e96a8;
}

.grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
}

.card {
    background: #171a22;
    border: 1px solid #292e3a;
    border-radius: 12px;
    padding: 20px;
}

.card h2 {
    margin-top: 0;
    font-size: 17px;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    color: #aeb6c7;
}

input,
select {
    width: 100%;
    padding: 10px;
    border-radius: 7px;
    border: 1px solid #343b4a;
    background: #0f1117;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #4da3ff;
}

.button {
    width: 100%;
    border: none;
    border-radius: 7px;
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.primary {
    background: #1677ff;
    color: white;
}

.primary:hover {
    background: #0d65df;
}

.secondary {
    background: #292e3a;
    color: white;
}

.secondary:hover {
    background: #343b4a;
}

.danger {
    background: #51252a;
    color: #ff8c8c;
}

.danger:hover {
    background: #673036;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th,
td {
    padding: 9px 8px;
    border-bottom: 1px solid #292e3a;
    text-align: left;
    font-size: 13px;
}

th {
    color: #8e96a8;
    font-weight: normal;
}

td input,
td select {
    padding: 7px 8px;
}

.channel-number {
    color: #4da3ff;
    font-weight: bold;
    width: 50px;
}

.delete-btn {
    border: none;
    background: transparent;
    color: #ff6b6b;
    cursor: pointer;
}

.delete-btn:hover {
    color: #ffaaaa;
}

.status {
    margin-top: 15px;
    padding: 12px;
    background: #10141c;
    border-radius: 7px;
    color: #8e96a8;
    font-size: 13px;
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #646d7d;
}

hr {
    border: 0;
    border-top: 1px solid #292e3a;
    margin: 22px 0;
}

@media (max-width: 900px) {

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">

        <span>MA2</span>
        Fixture Generator

    </div>

</header>


<main class="container">


<div class="title">

    <h1>
        MA2 灯库生成器 V1
    </h1>

    <p>
        通道表 → 属性识别 → MA2 XML
    </p>

</div>


<div class="grid">


<!-- ==============================
     左侧：灯具信息
================================ -->

<div class="card">

    <h2>
        灯具信息
    </h2>


    <div class="form-group">

        <label>
            Manufacturer
        </label>

        <input
            id="manufacturer"
            value="leite"
        >

    </div>


    <div class="form-group">

        <label>
            Fixture Name
        </label>

        <input
            id="fixtureName"
            placeholder="例如 X1060"
        >

    </div>


    <div class="form-group">

        <label>
            Short Manufacturer
        </label>

        <input
            id="shortManufacturer"
            value="leite"
        >

    </div>


    <div class="form-group">

        <label>
            Mode Name
        </label>

        <input
            id="modeName"
            placeholder="例如 8CH"
        >

    </div>


    <hr>


    <h2>
        快速操作
    </h2>


    <button
        class="button secondary"
        onclick="loadExample()"
    >
        加载 8CH 示例
    </button>


    <button
        class="button secondary"
        onclick="addChannel()"
    >
        ＋ 添加通道
    </button>


    <button
        class="button danger"
        onclick="clearChannels()"
    >
        清空全部通道
    </button>


    <button
        class="button primary"
        onclick="generateXML()"
    >
        生成 XML
    </button>


    <div
        class="status"
        id="status"
    >
        当前通道：0 CH
    </div>


</div>


<!-- ==============================
     右侧：通道表
================================ -->

<div class="card">

    <h2>
        通道配置
    </h2>


    <div class="table-wrap">


        <table>


            <thead>

                <tr>

                    <th>
                        CH
                    </th>

                    <th>
                        功能名称
                    </th>

                    <th>
                        MA2 属性
                    </th>

                    <th>
                        DMX 起始
                    </th>

                    <th>
                        DMX 结束
                    </th>

                    <th>
                        默认值
                    </th>

                    <th>
                        操作
                    </th>

                </tr>

            </thead>


            <tbody id="channelTable">

            </tbody>


        </table>


    </div>


    <div
        class="empty"
        id="emptyMessage"
    >

        暂无通道

        <br>

        点击左侧「加载 8CH 示例」
        或「添加通道」

    </div>


</div>


</div>


</main>


<script>


/* =================================
   全局通道数据
================================= */

let channels = [];


/* =================================
   MA2 属性列表
================================= */

const attributeOptions = [

    "Dimmer",

    "ColorRGB_R",

    "ColorRGB_G",

    "ColorRGB_B",

    "ColorRGB_W",

    "ColorRGB_A",

    "ColorRGB_UV",

    "Pan",

    "PanFine",

    "Tilt",

    "TiltFine",

    "Zoom",

    "Focus",

    "Iris",

    "Gobo",

    "GoboRotation",

    "Prism",

    "PrismRotation",

    "Strobe",

    "Shutter",

    "Frost",

    "CTC",

    "Control",

    "Effect",

    "Unknown"

];


/* =================================
   XML 特殊字符处理
================================= */

function escapeXML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&apos;");

}


/* =================================
   添加通道
================================= */

function addChannel(data = {}) {

    channels.push({

        name:
            data.name || "",

        attribute:
            data.attribute || "Dimmer",

        start:
            data.start ?? 0,

        end:
            data.end ?? 255,

        defaultValue:
            data.defaultValue ?? 0

    });


    renderChannels();

}


/* =================================
   删除通道
================================= */

function deleteChannel(index) {

    channels.splice(index, 1);

    renderChannels();

}


/* =================================
   清空通道
================================= */

function clearChannels() {

    if (channels.length === 0) {

        return;

    }


    if (
        !confirm("确定要清空全部通道吗？")
    ) {

        return;

    }


    channels = [];

    renderChannels();

}


/* =================================
   渲染通道表
================================= */

function renderChannels() {

    const table =
        document.getElementById(
            "channelTable"
        );


    const emptyMessage =
        document.getElementById(
            "emptyMessage"
        );


    table.innerHTML = "";


    if (channels.length === 0) {

        emptyMessage.style.display =
            "block";

    } else {

        emptyMessage.style.display =
            "block";

    }


    channels.forEach(
        (channel, index) => {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td class="channel-number">
                ${index + 1}
            </td>


            <td>

                <input
                    type="text"
                    value="${escapeXML(channel.name)}"
                    placeholder="例如 Dimmer"
                    onchange="
                        channels[${index}].name =
                        this.value
                    "
                >

            </td>


            <td>

                <select
                    onchange="
                        channels[${index}].attribute =
                        this.value
                    "
                >

                    ${attributeOptions.map(

                        option => `

                            <option
                                value="${option}"
                                ${
                                    option ===
                                    channel.attribute
                                    ? "selected"
                                    : ""
                                }
                            >

                                ${option}

                            </option>

                        `

                    ).join("")}

                </select>

            </td>


            <td>

                <input
                    type="number"
                    min="0"
                    max="255"
                    value="${channel.start}"
                    onchange="
                        channels[${index}].start =
                        Number(this.value)
                    "
                >

            </td>


            <td>

                <input
                    type="number"
                    min="0"
                    max="255"
                    value="${channel.end}"
                    onchange="
                        channels[${index}].end =
                        Number(this.value)
                    "
                >

            </td>


            <td>

                <input
                    type="number"
                    min="0"
                    max="255"
                    value="${channel.defaultValue}"
                    onchange="
                        channels[${index}].defaultValue =
                        Number(this.value)
                    "
                >

            </td>


            <td>

                <button
                    class="delete-btn"
                    onclick="
                        deleteChannel(${index})
                    "
                >
                    删除
                </button>

            </td>

        `;


        table.appendChild(row);

    });


    updateStatus();

}


/* =================================
   更新状态
================================= */

function updateStatus() {

    document.getElementById(
        "status"
    ).innerText =

        "当前通道：" +
        channels.length +
        " CH";

}


/* =================================
   加载 8CH 测试灯具
================================= */

function loadExample() {

    channels = [];


    document.getElementById(
        "manufacturer"
    ).value =
        "leite";


    document.getElementById(
        "fixtureName"
    ).value =
        "TEST LIGHT";


    document.getElementById(
        "shortManufacturer"
    ).value =
        "leite";


    document.getElementById(
        "modeName"
    ).value =
        "8CH";


    const exampleChannels = [

        {
            name: "Dimmer",
            attribute: "Dimmer",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "Red",
            attribute: "ColorRGB_R",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "Green",
            attribute: "ColorRGB_G",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "Blue",
            attribute: "ColorRGB_B",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "White",
            attribute: "ColorRGB_W",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "Strobe",
            attribute: "Strobe",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "Zoom",
            attribute: "Zoom",
            start: 0,
            end: 255,
            defaultValue: 0
        },

        {
            name: "Focus",
            attribute: "Focus",
            start: 0,
            end: 255,
            defaultValue: 0
        }

    ];


    channels =
        exampleChannels;


    renderChannels();

}


/* =================================
   生成 XML
================================= */

function generateXML() {

    const manufacturer =
        document.getElementById(
            "manufacturer"
        ).value.trim();


    const fixtureName =
        document.getElementById(
            "fixtureName"
        ).value.trim();


    const shortManufacturer =
        document.getElementById(
            "shortManufacturer"
        ).value.trim();


    const modeName =
        document.getElementById(
            "modeName"
        ).value.trim();


    /* -------------------------
       基础检查
    ------------------------- */

    if (!fixtureName) {

        alert(
            "请填写 Fixture Name"
        );

        return;

    }


    if (!modeName) {

        alert(
            "请填写 Mode Name"
        );

        return;

    }


    if (channels.length === 0) {

        alert(
            "请至少添加一个通道"
        );

        return;

    }


    /* -------------------------
       生成 Channel XML
    ------------------------- */

    let channelXML = "";


    channels.forEach(
        (channel, index) => {

            channelXML += `

        <Channel
            index="${index + 1}"
            name="${escapeXML(channel.name)}"
            attribute="${escapeXML(channel.attribute)}"
            dmx_start="${channel.start}"
            dmx_end="${channel.end}"
            default="${channel.defaultValue}"
        />`;

        }
    );


    /* -------------------------
       XML
    ------------------------- */

    const xml = `<?xml version="1.0" encoding="UTF-8"?>

<MA2Fixture>

    <Manufacturer>
        ${escapeXML(manufacturer)}
    </Manufacturer>

    <ShortManufacturer>
        ${escapeXML(shortManufacturer)}
    </ShortManufacturer>

    <FixtureName>
        ${escapeXML(fixtureName)}
    </FixtureName>

    <ModeName>
        ${escapeXML(modeName)}
    </ModeName>

    <ChannelCount>
        ${channels.length}
    </ChannelCount>

    <Channels>
        ${channelXML}
    </Channels>

</MA2Fixture>
`;


    /* -------------------------
       下载文件
    ------------------------- */

    const blob =
        new Blob(
            [xml],
            {
                type:
                    "application/xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        `${fixtureName}_${modeName}.xml`;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(url);


    document.getElementById(
        "status"
    ).innerText =

        "XML 已生成：" +
        fixtureName +
        " / " +
        modeName +
        " / " +
        channels.length +
        " CH";

}


/* =================================
   页面启动
================================= */

renderChannels();

</script>


</body>

</html>
