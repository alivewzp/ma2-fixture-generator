<script>

let channels=[];
let generatedXML="";


/* ======================================
   初始化
======================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{
        load20CH();
    }
);


/* ======================================
   创建 Function
======================================= */

function createFunction(
    name="Open",
    from="0",
    to="255"
){

    return{
        name:name,
        from:String(from),
        to:String(to)
    };

}


/* ======================================
   创建 Channel
======================================= */

function createChannel(
    index,
    name="",
    attribute="",
    feature="",
    preset="",
    fine=""
){

    return{

        index:index,

        name:name,

        attribute:attribute,

        feature:feature,

        preset:preset,

        fine:fine,

        default:"0",

        highlight:"0",

        functions:[
            createFunction(
                "Open",
                "0",
                "255"
            )
        ]

    };

}


/* ======================================
   自动判断 Attribute
======================================= */

function detectAttribute(name){

    const n=
        String(name)
        .toLowerCase()
        .trim();


    if(
        n.includes("pan")
    ){
        return "Pan";
    }


    if(
        n.includes("tilt")
    ){
        return "Tilt";
    }


    if(
        n.includes("dimmer")
        ||
        n==="intensity"
        ||
        n.includes("brightness")
    ){
        return "Dimmer";
    }


    if(
        n.includes("red")
        ||
        n.includes("green")
        ||
        n.includes("blue")
        ||
        n.includes("white")
        ||
        n.includes("cyan")
        ||
        n.includes("magenta")
        ||
        n.includes("yellow")
        ||
        n.includes("cto")
        ||
        n.includes("color")
    ){
        return "Color";
    }


    if(
        n.includes("gobo")
    ){
        return "Gobo";
    }


    if(
        n.includes("prism")
    ){
        return "Prism";
    }


    if(
        n.includes("focus")
    ){
        return "Focus";
    }


    if(
        n.includes("zoom")
    ){
        return "Zoom";
    }


    if(
        n.includes("strobe")
        ||
        n.includes("shutter")
    ){
        return "Shutter";
    }


    if(
        n.includes("reset")
        ||
        n.includes("lamp")
        ||
        n.includes("control")
        ||
        n.includes("mode")
    ){
        return "Control";
    }


    if(
        n.includes("speed")
    ){
        return "Control";
    }


    return "Control";

}


/* ======================================
   自动 Feature
======================================= */

function detectFeature(name){

    return detectAttribute(name);

}


/* ======================================
   自动 Preset
======================================= */

function detectPreset(name){

    const a=
        detectAttribute(name);


    if(
        a==="Pan"
        ||
        a==="Tilt"
    ){
        return "Position";
    }


    return a;

}


/* ======================================
   判断 Fine
======================================= */

function detectFine(name){

    const n=
        String(name)
        .toLowerCase();


    if(
        n.includes("fine")
        ||
        n.includes("16bit")
        ||
        n.includes("16 bit")
    ){

        return true;

    }


    return false;

}


/* ======================================
   HTML 转义
======================================= */

function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ======================================
   XML 转义
======================================= */

function escapeXML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&apos;");

}


/* ======================================
   解析 DMX 范围
======================================= */

function parseDMXRange(text){

    if(!text){

        return null;

    }


    const t=
        String(text)
        .replace(/–/g,"-")
        .replace(/—/g,"-");


    let m=
        t.match(
            /(\d{1,3})\s*[-~]\s*(\d{1,3})/
        );


    if(m){

        return{
            from:m[1],
            to:m[2]
        };

    }


    return null;

}


/* ======================================
   解析一行
======================================= */

function parseLine(line){

    let text=
        line
        .replace(/\t+/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!text){

        return null;

    }


    /*
       格式：

       10 Strobe 11-100 Strobe
    */

    let match=
        text.match(
            /^(\d+)\s+(.+?)\s+(\d{1,3})\s*[-~]\s*(\d{1,3})\s*(.*)$/i
        );


    if(match){

        return{

            channel:Number(match[1]),

            name:match[2].trim(),

            from:match[3],

            to:match[4],

            functionName:
                match[5].trim()
                ||
                match[2].trim()

        };

    }


    /*
       格式：

       10 Strobe 11-100
    */

    match=
        text.match(
            /^(\d+)\s+(.+?)\s+(\d{1,3})\s*[-~]\s*(\d{1,3})$/i
        );


    if(match){

        return{

            channel:Number(match[1]),

            name:match[2].trim(),

            from:match[3],

            to:match[4],

            functionName:
                match[2].trim()

        };

    }


    /*
       普通：

       1 Dimmer
    */

    match=
        text.match(
            /^(\d+)\s+(.+)$/
        );


    if(match){

        return{

            channel:Number(match[1]),

            name:match[2].trim(),

            from:null,

            to:null,

            functionName:null

        };

    }


    return null;

}


/* ======================================
   智能解析
======================================= */

function smartParse(){

    const input=
        document
        .getElementById("smartInput")
        .value;


    if(!input.trim()){

        alert("请先粘贴厂家通道表");

        return;

    }


    const lines=
        input
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);


    const map={};


    lines.forEach(line=>{

        const item=
            parseLine(line);


        if(!item){

            return;

        }


        const ch=item.channel;


        if(!map[ch]){

            const baseName=
                item.name;


            const attribute=
                detectAttribute(baseName);


            map[ch]=
                createChannel(
                    ch,
                    baseName,
                    attribute,
                    detectFeature(baseName),
                    detectPreset(baseName),
                    detectFine(baseName)
                        ? "FINE"
                        : ""
                );


            /*
               如果第一行是 Function 行
               删除默认 Function
            */

            if(
                item.from!==null
                &&
                item.to!==null
            ){

                map[ch].functions=[];

            }

        }


        /*
           有 DMX 范围
        */

        if(
            item.from!==null
            &&
            item.to!==null
        ){

            map[ch]
                .functions
                .push(
                    createFunction(
                        item.functionName
                        ||
                        item.name,
                        item.from,
                        item.to
                    )
                );

        }

    });


    channels=
        Object
        .values(map)
        .sort(
            (a,b)=>
                a.index-b.index
        );


    /*
       补默认 Function
    */

    channels.forEach(ch=>{

        if(
            !ch.functions.length
        ){

            ch.functions=[
                createFunction(
                    "Open",
                    "0",
                    "255"
                )
            ];

        }

    });


    renderChannels();


    /*
       生成解析预览
    */

    let preview="";


    channels.forEach(ch=>{

        preview+=
            `CH ${ch.index}  ${ch.name}\n`;

        preview+=
            `  Attribute: ${ch.attribute}\n`;

        preview+=
            `  Feature:   ${ch.feature}\n`;

        preview+=
            `  Preset:    ${ch.preset}\n`;


        if(ch.fine){

            preview+=
                `  Fine:      ${ch.fine}\n`;

        }


        ch.functions
            .forEach((fn,i)=>{

                preview+=
                    `  ├─ ${fn.name}  `
                    +
                    `${fn.from}-${fn.to}\n`;

            });


        preview+="\n";

    });


    document
        .getElementById("parsePreview")
        .textContent=
            preview;


    document
        .getElementById("parseStatus")
        .innerText=
            `解析完成：${channels.length} 个通道，`
            +
            `${channels.reduce(
                (sum,ch)=>
                    sum+ch.functions.length,
                0
            )} 个 Function`;

}

/* ======================================
   添加通道
======================================= */

function addChannel(){

    const index=
        channels.length+1;


    channels.push(
        createChannel(
            index,
            "Channel "+index
        )
    );


    renderChannels();

}


/* ======================================
   删除通道
======================================= */

function deleteChannel(index){

    channels.splice(
        index,
        1
    );


    channels.forEach(
        (ch,i)=>{
            ch.index=i+1;
        }
    );


    renderChannels();

}


/* ======================================
   清空
======================================= */

function clearChannels(){

    channels=[];

    renderChannels();

}


/* ======================================
   添加 Function
======================================= */

function addFunction(
    channelIndex
){

    channels[channelIndex]
        .functions
        .push(
            createFunction(
                "Function "
                +
                (
                    channels[channelIndex]
                    .functions
                    .length+1
                ),
                "0",
                "255"
            )
        );


    renderChannels();

}


/* ======================================
   删除 Function
======================================= */

function deleteFunction(
    channelIndex,
    functionIndex
){

    channels[channelIndex]
        .functions
        .splice(
            functionIndex,
            1
        );


    renderChannels();

}


/* ======================================
   更新 Channel
======================================= */

function updateChannel(
    index,
    key,
    value
){

    channels[index][key]=value;

}


/* ======================================
   更新 Function
======================================= */

function updateFunction(
    channelIndex,
    functionIndex,
    key,
    value
){

    channels[channelIndex]
        .functions[functionIndex][key]=
            value;

}


/* ======================================
   渲染
======================================= */

function renderChannels(){

    const container=
        document.getElementById(
            "channels"
        );


    container.innerHTML="";


    channels.forEach(
        (ch,cIndex)=>{

            const card=
                document.createElement(
                    "div"
                );


            card.className=
                "channel-card";


            const header=
                document.createElement(
                    "div"
                );


            header.className=
                "channel-header";


            header.innerHTML=`

                <div class="channel-number">
                    ${ch.index}
                </div>

                <input
                    value="${escapeHTML(ch.name)}"
                    placeholder="名称"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'name',
                            this.value
                        )
                    "
                >

                <input
                    value="${escapeHTML(ch.attribute)}"
                    placeholder="Attribute"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'attribute',
                            this.value
                        )
                    "
                >

                <input
                    value="${escapeHTML(ch.feature)}"
                    placeholder="Feature"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'feature',
                            this.value
                        )
                    "
                >

                <input
                    value="${escapeHTML(ch.preset)}"
                    placeholder="Preset"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'preset',
                            this.value
                        )
                    "
                >

                <input
                    value="${escapeHTML(ch.fine)}"
                    placeholder="Fine"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'fine',
                            this.value
                        )
                    "
                >

                <input
                    type="number"
                    value="${escapeHTML(ch.default)}"
                    placeholder="Default"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'default',
                            this.value
                        )
                    "
                >

                <input
                    type="number"
                    value="${escapeHTML(ch.highlight)}"
                    placeholder="Highlight"
                    onchange="
                        updateChannel(
                            ${cIndex},
                            'highlight',
                            this.value
                        )
                    "
                >

                <button
                    class="small"
                    onclick="
                        addFunction(
                            ${cIndex}
                        )
                    "
                >
                    ＋ Function
                </button>

                <button
                    class="danger small"
                    onclick="
                        deleteChannel(
                            ${cIndex}
                        )
                    "
                >
                    删除
                </button>

            `;


            card.appendChild(
                header
            );


            const functionArea=
                document.createElement(
                    "div"
                );


            functionArea.className=
                "functions";


            const title=
                document.createElement(
                    "div"
                );


            title.className=
                "function-title";


            title.innerHTML=
                `<span class="badge">
                    ${ch.functions.length}
                </span>
                Channel Functions / Channel Sets`;


            functionArea.appendChild(
                title
            );


            ch.functions.forEach(
                (fn,fIndex)=>{

                    const row=
                        document.createElement(
                            "div"
                        );


                    row.className=
                        "function-row";


                    row.innerHTML=`

                        <div class="function-number">
                            #${fIndex+1}
                        </div>

                        <input
                            value="${escapeHTML(fn.name)}"
                            placeholder="Function Name"
                            onchange="
                                updateFunction(
                                    ${cIndex},
                                    ${fIndex},
                                    'name',
                                    this.value
                                )
                            "
                        >

                        <input
                            type="number"
                            min="0"
                            max="255"
                            value="${escapeHTML(fn.from)}"
                            placeholder="From"
                            onchange="
                                updateFunction(
                                    ${cIndex},
                                    ${fIndex},
                                    'from',
                                    this.value
                                )
                            "
                        >

                        <input
                            type="number"
                            min="0"
                            max="255"
                            value="${escapeHTML(fn.to)}"
                            placeholder="To"
                            onchange="
                                updateFunction(
                                    ${cIndex},
                                    ${fIndex},
                                    'to',
                                    this.value
                                )
                            "
                        >

                        <div>
                            DMX：
                            ${fn.from}
                            -
                            ${fn.to}
                        </div>

                        <button
                            class="danger small"
                            onclick="
                                deleteFunction(
                                    ${cIndex},
                                    ${fIndex}
                                )
                            "
                        >
                            删除
                        </button>

                    `;


                    functionArea.appendChild(
                        row
                    );

                }
            );


            card.appendChild(
                functionArea
            );


            container.appendChild(
                card
            );

        }
    );


    document
        .getElementById(
            "channelStatus"
        )
        .innerText=
            "当前通道数："
            +
            channels.length
            +
            "　|　Functions："
            +
            channels.reduce(
                (sum,ch)=>
                    sum+ch.functions.length,
                0
            );

}


/* ======================================
   XML Channel
======================================= */

function buildChannelXML(ch){

    let fine="";


    if(
        ch.fine
        &&
        ch.fine!=="FINE"
    ){

        fine=
            ` fine="${escapeXML(
                ch.fine
            )}"`;

    }


    let functionsXML="";


    ch.functions.forEach(
        (fn,index)=>{

            functionsXML+=`

                <ChannelFunction
                    index="${index}"
                    name="${escapeXML(
                        fn.name
                    )}"
                    from="0"
                    to="100"
                    min_dmx_24="${escapeXML(
                        fn.from
                    )}"
                    max_dmx_24="${escapeXML(
                        fn.to
                    )}"
                    attribute="${escapeXML(
                        ch.attribute
                    )}"
                    feature="${escapeXML(
                        ch.feature
                    )}"
                    preset="${escapeXML(
                        ch.preset
                    )}">

                    <ChannelSet
                        index="0"
                        name="${escapeXML(
                            fn.name
                        )}"
                        from_dmx="${escapeXML(
                            fn.from
                        )}"
                        to_dmx="${escapeXML(
                            fn.to
                        )}"/>

                </ChannelFunction>`;

        }
    );


    return`

            <ChannelType
                index="${escapeXML(
                    ch.index
                )}"
                attribute="${escapeXML(
                    ch.attribute
                )}"
                feature="${escapeXML(
                    ch.feature
                )}"
                preset="${escapeXML(
                    ch.preset
                )}"
                coarse="${escapeXML(
                    ch.index
                )}"
                ${fine}
                default="${escapeXML(
                    ch.default
                )}"
                highlight_value="${escapeXML(
                    ch.highlight
                )}">

                ${functionsXML}

            </ChannelType>`;

}


/* ======================================
   XML
======================================= */

function generateXML(){

    const fixtureName=
        document
        .getElementById(
            "fixtureName"
        )
        .value
        .trim()
        ||
        "Fixture";


    const modeName=
        document
        .getElementById(
            "modeName"
        )
        .value
        .trim()
        ||
        "1CH";


    const manufacturer=
        document
        .getElementById(
            "manufacturer"
        )
        .value
        .trim()
        ||
        "Unknown";


    const shortName=
        document
        .getElementById(
            "shortName"
        )
        .value
        .trim()
        ||
        fixtureName;


    let channelXML="";


    channels.forEach(
        ch=>{
            channelXML+=
                buildChannelXML(ch);
        }
    );


    let instances="";


    channels.forEach(
        (ch,i)=>{

            instances+=`

            <Instance
                index="${i}"
                module_index="0"/>`;

        }
    );


    generatedXML=
`<?xml version="1.0" encoding="UTF-8"?>

<MA
 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
 xmlns="http://schemas.malighting.de/grandma2/xml/MA"
 xsi:schemaLocation="http://schemas.malighting.de/grandma2/xml/MA http://schemas.malighting.de/grandma2/xml/3.1.2/MA.xsd"
 major_vers="3"
 minor_vers="1"
 stream_vers="2">

    <Info
        datetime="${new Date().toISOString()}"
        showfile="MA2 Fixture Generator V3.2"/>

    <FixtureType
        index="21"
        name="${escapeXML(
            fixtureName
        )}"
        mode="${escapeXML(
            modeName
        )}">

        <short_name>
            ${escapeXML(
                shortName
            )}
        </short_name>

        <manufacturer>
            ${escapeXML(
                manufacturer
            )}
        </manufacturer>

        <short_manufacturer>
            ${escapeXML(
                manufacturer
            )}
        </short_manufacturer>

        <Modules index="0">

            <Module
                index="0"
                class="Headmover"
                beamtype="Spot"
                beam_angle="4"
                beam_intensity="10000">

                <Body>

                    <Size
                        x="0.3"
                        y="0.3"
                        z="0.5"/>

                </Body>

                ${channelXML}

            </Module>

        </Modules>

        <Instances index="1">

            ${instances}

        </Instances>

        <Wheels index="2"/>

        <VirtualFunctionBlocks index="3"/>

        <FixtureMacroCollect index="5"/>

        <Body/>

        <AutoPresets index="4"/>

    </FixtureType>

</MA>`;


    document
        .getElementById(
            "xmlPreview"
        )
        .textContent=
            generatedXML;


    document
        .getElementById(
            "channelStatus"
        )
        .innerText=
            "XML 已生成："
            +
            channels.length
            +
            " 个通道 / "
            +
            channels.reduce(
                (sum,ch)=>
                    sum+ch.functions.length,
                0
            )
            +
            " 个 Function";

}


/* ======================================
   下载
======================================= */

function downloadXML(){

    if(!generatedXML){

        generateXML();

    }


    const fixtureName=
        document
        .getElementById(
            "fixtureName"
        )
        .value
        .trim()
        ||
        "Fixture";


    const modeName=
        document
        .getElementById(
            "modeName"
        )
        .value
        .trim()
        ||
        "Mode";


    const fileName=
        `${fixtureName}_${modeName}_${channels.length}CH.xml`;


    const blob=
        new Blob(
            [generatedXML],
            {
                type:
                    "application/xml;charset=utf-8"
            }
        );


    const url=
        URL.createObjectURL(
            blob
        );


    const a=
        document.createElement(
            "a"
        );


    a.href=url;

    a.download=fileName;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
