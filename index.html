<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MA2 灯库生成器 V1</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f1117;
    color: #ffffff;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

/* 顶部 */

.header {

    height: 64px;

    display: flex;

    align-items: center;

    padding: 0 28px;

    background: #171a22;

    border-bottom:
        1px solid #292e3a;
}

.logo {

    font-size: 20px;

    font-weight: bold;
}

.logo span {

    color: #4da3ff;
}

/* 页面 */

.container {

    max-width: 1500px;

    margin: 30px auto;

    padding: 0 24px;
}

.title {

    margin-bottom: 24px;
}

.title h1 {

    margin: 0 0 8px;

    font-size: 28px;
}

.title p {

    margin: 0;

    color: #8e96a8;
}

/* 布局 */

.grid {

    display: grid;

    grid-template-columns:
        320px
        1fr;

    gap: 20px;
}

.card {

    background: #171a22;

    border:
        1px solid #292e3a;

    border-radius: 12px;

    padding: 20px;
}

.card h2 {

    margin-top: 0;

    font-size: 17px;
}

/* 输入框 */

.form-group {

    margin-bottom: 16px;
}

label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    color: #aeb6c7;
}

input,
select {

    width: 100%;

    padding: 10px;

    border-radius: 7px;

    border:
        1px solid #343b4a;

    background: #0f1117;

    color: white;

    outline: none;
}

input:focus,
select:focus {

    border-color:
        #4da3ff;
}

/* 按钮 */

.button {

    width: 100%;

    border: none;

    border-radius: 7px;

    padding: 12px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;
}

.primary {

    background:
        #1677ff;

    color: white;
}

.secondary {

    background:
        #292e3a;

    color: white;
}

.danger {

    background:
        #51252a;

    color: #ff8c8c;
}

/* 表格 */

.table-wrap {

    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 850px;
}

th,
td {

    padding:
        9px 8px;

    border-bottom:
        1px solid #292e3a;

    text-align:
        left;

    font-size: 13px;
}

th {

    color:
        #8e96a8;

    font-weight:
        normal;
}

td input,
td select {

    padding:
        7px 8px;
}

/* 通道编号 */

.channel-number {

    color:
        #4da3ff;

    font-weight:
        bold;

    width: 50px;
}

/* 状态 */

.status {

    margin-top:
        15px;

    padding:
        12px;

    background:
        #10141c;

    border-radius:
        7px;

    color:
        #8e96a8;

    font-size:
        13px;
}

/* 删除 */

.delete-btn {

    border: none;

    background:
        transparent;

    color:
        #ff6b6b;

    cursor:
        pointer;

    font-size:
        16px;
}

.delete-btn:hover {

    color:
        #ffaaaa;
}

/* 手机 */

@media (max-width: 900px) {

    .grid {

        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">

        <span>MA2</span>
        Fixture Generator

    </div>

</header>


<main class="container">


<div class="title">

    <h1>
        MA2 灯库生成器 V1
    </h1>

    <p>
        通道表 → 属性识别 → MA2 XML
    </p>

</div>


<div class="grid">


<!-- ======================
     左侧
====================== -->

<div class="card">

<h2>
    灯具信息
</h2>


<div class="form-group">

<label>
    Manufacturer
</label>

<input
    id="manufacturer"
    value="leite"
>

</div>


<div class="form-group">

<label>
    Fixture Name
</label>

<input
    id="fixtureName"
    placeholder="例如 X1060"
>

</div>


<div class="form-group">

<label>
    Short Manufacturer
</label>

<input
    id="shortManufacturer"
    value="leite"
>

</div>


<div class="form-group">

<label>
    Mode Name
</label>

<input
    id="modeName"
    placeholder="例如 124CH"
>

</div>


<hr>


<h2>
    快速测试
</h2>


<button
    class="button secondary"
    onclick="loadExample()"
>

加载 8CH 示例

</button>


<button
    class="button secondary"
    onclick="addChannel()"
>

＋ 添加通道

</button>


<button
    class="button danger"
    onclick="clearChannels()"
>

清空全部通道

</button>


<button
    class="button primary"
    onclick="generateXML()"
>

生成 MA2 XML

</button>


<div
    class="status"
    id="status"
>

当前通道：
0 CH

</div>


</div>


<!-- ======================
     右侧
====================== -->

<div class="card">

<h2>
    通道配置
</h2>


<div class="table-wrap">


<table>


<thead>

<tr>

<th>
CH
</th>

<th>
功能名称
</th>

<th>
MA2 属性
</th>

<th>
DMX 起始
</th>

<th>
DMX 结束
</th>

<th>
默认值
</th>

<th>
操作
</th>

</tr>

</thead>


<tbody
    id="channelTable"
>
</tbody>


</table>


</div>


</div>


</div>


</main>


<script>


/*
================================
通道数据
================================
*/

let channels = [];


/*
================================
属性类型
================================
*/

const attributeOptions = [

    "Dimmer",

    "ColorRGB_R",

    "ColorRGB_G",

    "ColorRGB_B",

    "ColorRGB_W",

    "Pan",

    "Tilt",

    "Zoom",

    "Focus",

    "Gobo",

    "Prism",

    "Iris",

    "Strobe",

    "Shutter",

    "Control",

    "Effect",

    "Unknown"

];


/*
================================
添加通道
================================
*/

function addChannel(data = {}) {

    const channel = {

        name:
            data.name || "",

        attribute:
            data.attribute || "Dimmer",

        start:
            data.start ?? 0,

        end:
            data.end ?? 255,

        defaultValue:
            data.defaultValue ?? 0

    };


    channels.push(channel);


    renderChannels();

}


/*
================================
删除通道
================================
*/

function deleteChannel(index) {

    channels.splice(index, 1);

    renderChannels();

}


/*
================================
清空
================================
*/

function clearChannels() {

    channels = [];

    renderChannels();

}


/*
================================
渲染表格
================================
*/

function renderChannels() {

    const table =
        document.getElementById(
            "channelTable"
        );


    table.innerHTML = "";


    channels.forEach(
        (channel, index) => {


        const row =
            document.createElement("tr");


        row.innerHTML = `

<td class="channel-number">
    ${index + 1}
</td>


<td>

<input
    value="${channel.name}"
    oninput="
        channels[${index}].name =
        this.value
    "
    placeholder="例如 Dimmer"
>

</td>


<td>

<select
    onchange="
        channels[${index}].attribute =
        this.value
    "
>

${attributeOptions.map(

    option => `

<option
    value="${option}"
    ${
        option === channel.attribute
        ? "selected"
        : ""
    }
>

${option}

</option>

`).join("")}

</select>

</td>


<td>

<input
    type="number"
    min="0"
    max="255"
    value="${channel.start}"
    onchange="
        channels[${index}].start =
        Number(this.value)
    "
>

</td>


<td>

<input
    type="number"
    min="0"
    max="255"
    value="${channel.end}"
    onchange="
        channels[${index}].end =
        Number(this.value)
    "
>

</td>


<td>

<input
    type="number"
    min="0"
    max="255"
    value="${channel.defaultValue}"
    onchange="
        channels[${index}].defaultValue =
        Number(this.value)
    "
>

</td>


<td>

<button
    class="delete-btn"
    onclick="
        deleteChannel(${index})
    "
>
    删除
</button>

</td>

`;


        table.appendChild(row);

    });


    updateStatus();

}


/*
================================
状态
================================
*/

function updateStatus() {

    document.getElementById(
        "status"
    ).innerText =

        "当前通道：" +
        channels.length +
        " CH";

}


/*
================================
加载测试灯具
================================
*/

function loadExample() {

    channels = [];


    addChannel({

        name: "Dimmer",

        attribute: "Dimmer",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "Red",

        attribute: "ColorRGB_R",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "Green",

        attribute: "ColorRGB_G",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "Blue",

        attribute: "ColorRGB_B",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "White",

        attribute: "ColorRGB_W",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "Strobe",

        attribute: "Strobe",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "Zoom",

        attribute: "Zoom",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    addChannel({

        name: "Focus",

        attribute: "Focus",

        start: 0,

        end: 255,

        defaultValue: 0

    });


    document.getElementById(
        "fixtureName"
    ).value =
        "TEST LIGHT";


    document.getElementById(
        "modeName"
    ).value =
        "8CH";

}


/*
================================
生成 XML
================================
*/

function generateXML() {

    const manufacturer =
        document.getElementById(
            "manufacturer"
        ).value;


    const fixtureName =
        document.getElementById(
            "fixtureName"
        ).value;


    const modeName =
        document.getElementById(
            "modeName"
        ).value;


    if (!fixtureName) {

        alert(
            "请先填写 Fixture Name"
        );

        return;

    }


    if (channels.length === 0) {

        alert(
            "请先添加通道"
        );

        return;

    }


    console.log({

        manufacturer,

        fixtureName,

        modeName,

        channels

    });


    alert(
        "通道数据已经准备完成，下一步开始生成真正的 MA2 XML。"
    );

}


</script>


</body>

</html>
