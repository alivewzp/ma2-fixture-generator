<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA2 灯库生成器</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #0f1117;
            color: #ffffff;
        }

        .header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            background: #171a22;
            border-bottom: 1px solid #292e3a;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logo span {
            color: #4da3ff;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 24px;
        }

        .title {
            margin-bottom: 24px;
        }

        .title h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .title p {
            margin: 0;
            color: #8e96a8;
        }

        .grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .card {
            background: #171a22;
            border: 1px solid #292e3a;
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 17px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #aeb6c7;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 7px;
            border: 1px solid #343b4a;
            background: #0f1117;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4da3ff;
        }

        .upload {
            border: 2px dashed #343b4a;
            border-radius: 8px;
            padding: 28px 15px;
            text-align: center;
            color: #8e96a8;
            cursor: pointer;
            margin-bottom: 18px;
        }

        .upload:hover {
            border-color: #4da3ff;
        }

        .button {
            width: 100%;
            border: none;
            border-radius: 7px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .primary {
            background: #1677ff;
            color: white;
        }

        .primary:hover {
            background: #0d65df;
        }

        .secondary {
            background: #292e3a;
            color: white;
        }

        .secondary:hover {
            background: #343b4a;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        th,
        td {
            padding: 11px 10px;
            border-bottom: 1px solid #292e3a;
            text-align: left;
            font-size: 13px;
        }

        th {
            color: #8e96a8;
            font-weight: normal;
        }

        td input,
        td select {
            padding: 7px 8px;
        }

        .empty {
            padding: 70px 20px;
            text-align: center;
            color: #6f7788;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #10141c;
            border-radius: 7px;
            color: #8e96a8;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span>MA2</span> Fixture Generator
    </div>
</header>

<main class="container">

    <div class="title">
        <h1>MA2 灯库生成器</h1>
        <p>上传或填写灯具通道表，自动生成 MA2 XML 灯库</p>
    </div>

    <div class="grid">

        <!-- 左侧设置 -->
        <div class="card">

            <h2>灯具信息</h2>

            <div class="form-group">
                <label>Manufacturer</label>
                <input id="manufacturer" value="leite">
            </div>

            <div class="form-group">
                <label>Fixture Name</label>
                <input id="fixtureName" placeholder="例如 X1060">
            </div>

            <div class="form-group">
                <label>Short Manufacturer</label>
                <input id="shortManufacturer" value="leite">
            </div>

            <div class="form-group">
                <label>Mode Name</label>
                <input id="modeName" placeholder="例如 124CH">
            </div>

            <div class="form-group">
                <label>通道数量</label>
                <input id="channelCount" type="number" value="8">
            </div>

            <h2>导入通道表</h2>

            <div class="upload">
                点击选择 CSV / TXT 文件
                <input
                    type="file"
                    id="fileInput"
                    accept=".csv,.txt"
                    style="display:none;"
                >
            </div>

            <button class="button secondary" onclick="addChannel()">
                ＋ 添加通道
            </button>

            <button class="button primary" onclick="generateXML()">
                生成 MA2 XML
            </button>

            <div class="status" id="status">
                等待输入通道信息
            </div>

        </div>

        <!-- 右侧通道表 -->
        <div class="card">

            <h2>通道配置</h2>

            <div class="table-wrap">

                <table>
                    <thead>
                        <tr>
                            <th>CH</th>
                            <th>功能名称</th>
                            <th>属性类型</th>
                            <th>DMX 起始</th>
                            <th>DMX 结束</th>
                            <th>默认值</th>
                        </tr>
                    </thead>

                    <tbody id="channelTable">

                        <tr>
                            <td>1</td>
                            <td>
                                <input value="Dimmer">
                            </td>
                            <td>
                                <select>
                                    <option>Dimmer</option>
                                    <option>Color</option>
                                    <option>Position</option>
                                    <option>Gobo</option>
                                    <option>Beam</option>
                                    <option>Control</option>
                                </select>
                            </td>
                            <td><input value="0"></td>
                            <td><input value="255"></td>
                            <td><input value="0"></td>
                        </tr>

                    </tbody>
                </table>

            </div>

            <div class="empty">
                后续这里会自动识别你上传的灯具通道表
            </div>

        </div>

    </div>

</main>

<script>

function addChannel() {

    const table = document.getElementById("channelTable");

    const channelNumber = table.children.length + 1;

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${channelNumber}</td>

        <td>
            <input placeholder="例如 Red">
        </td>

        <td>
            <select>
                <option>Dimmer</option>
                <option>Color</option>
                <option>Position</option>
                <option>Gobo</option>
                <option>Beam</option>
                <option>Control</option>
            </select>
        </td>

        <td>
            <input value="0">
        </td>

        <td>
            <input value="255">
        </td>

        <td>
            <input value="0">
        </td>
    `;

    table.appendChild(row);

    updateStatus();
}


function updateStatus() {

    const count =
        document.getElementById("channelTable").children.length;

    document.getElementById("status").innerText =
        "当前通道数量：" + count;
}


function generateXML() {

    const manufacturer =
        document.getElementById("manufacturer").value;

    const fixtureName =
        document.getElementById("fixtureName").value;

    const modeName =
        document.getElementById("modeName").value;

    const count =
        document.getElementById("channelTable").children.length;

    document.getElementById("status").innerText =
        "准备生成：" +
        manufacturer +
        " / " +
        fixtureName +
        " / " +
        modeName +
        " / " +
        count +
        "CH";

    alert("XML 生成功能下一步加入");
}

</script>

</body>
</html>
